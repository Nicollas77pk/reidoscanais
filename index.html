
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReiDosCanais | TV Online</title>

    <meta name="description"
        content="Assista canais de TV online organizados por categorias de forma rápida e prática.">

    <link rel="icon" href="assets/favicon.png">

    <!-- CSS -->

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/responsive.css">

<link rel="stylesheet" href="css/agenda.css">
<link rel="stylesheet" href="css/categorias.css">

<link rel="stylesheet" href="css/modal.css">

</head>   

<body>

    <!-- ================= HEADER ================= -->

  <header class="header">

    <div class="container">

        <button id="menuBtn" class="menu-btn">
            ☰
        </button>


        <a href="/reidoscanais/" class="logo">

            <div class="logo-icon">
                👑
            </div>

            <div class="logo-text">

                <span>Rei</span>

                <strong>Dos Canais</strong>

            </div>

        </a>


        <nav class="menu">

            <a href="#">
                Início
            </a>

            <a href="#agenda">
                Agenda
            </a>

            <a href="#canais">
                Canais
            </a>

            <a href="#">
                Esportes
            </a>

        </nav>


        <div class="search">

            <input 
            id="campoBusca"
            placeholder="Pesquisar canais...">

            <button id="btnBusca">
                🔍
            </button>

        </div>


    </div>


</header>


<!-- MENU MOBILE FORA DO HEADER -->

<div id="menuMobile" class="menu-mobile">

    <a href="/">Início</a>

    <a href="#">Canais</a>

    <a href="#">Agenda</a>

    <a href="#">Favoritos</a>

</div>


</div>

</header>
    

<main>


<!-- ================= AGENDA AO VIVO ================= -->

<section class="agenda-section">

    <div class="container">

        <div class="section-top">

            <h2>

                <svg xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="section-icon">

                    <path d="m17 2-5 5-5-5"></path>

                    <rect 
                    width="20" 
                    height="15" 
                    x="2" 
                    y="7" 
                    rx="2"></rect>

                </svg>

                Agenda Ao Vivo

            </h2>



            <div class="section-actions">


                <button 
                id="agendaPrev" 
                class="slider-btn">

                    ‹

                </button>



                <button 
                id="agendaNext" 
                class="slider-btn">

                    ›

                </button>



                <a href="#" class="ver-todos">

                    Ver todos →

                </a>


            </div>


        </div>



        <div 
        id="agendaSlider" 
        class="agenda-slider">

        </div>


    </div>


</section>






<!-- ================= CATEGORIAS ================= -->


<div id="categorias"></div>



</main>




    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 Rei Dos Canais

        </p>

    </footer>

        <!-- MODAL PLAYER -->
<div id="playerModal" class="modal">

    <button id="fecharModal" class="fechar">
        ✕
    </button>

    <div class="modal-content">

        <div class="player">

            <iframe
                id="playerFrame"
                allowfullscreen
                frameborder="0"
                allow="autoplay; encrypted-media; picture-in-picture">
            </iframe>

        </div>

        <div class="modal-info">

            <img id="modalLogo" src="" alt="">

            <div>

                <h2 id="modalTitulo"></h2>

                <span id="modalCategoria"></span>

            </div>

        </div>

        <div class="programacao">

            <h3>🔴 Agora</h3>

            <p id="programaAtual"></p>

            <h3>Depois</h3>

            <p id="proximoPrograma"></p>

        </div>

    </div>

</div>


    <!-- JavaScript -->
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/menu.js"></script>

<script src="js/agenda.js"></script>

<script src="js/render.js"></script>

<script src="js/modal.js"></script>

<script src="js/home.js"></script>

</body>

</html>
