
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

        content="Assista canais de TV online organizados por categorias de forma rápida e prática.">

    <link rel="icon" href="assets/favicon.png">

    <!-- CSS -->

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/canais.css">
    <link rel="stylesheet" href="css/agenda.css">
    <link rel="stylesheet" href="css/modal.css">

</head>   

<body>

    <!-- ================= HEADER ================= -->

  <header class="header">

<div class="container">


<a href="index.html" class="logo">


<div class="logo-icon">
👑
</div>


<div class="logo-text">

<span>Rei</span>

<strong>Dos Canais</strong>

</div>


</a>



<nav class="menu">

<a href="#">
Início
</a>

<a href="#agenda">
Agenda
</a>

<a href="#canais">
Canais
</a>

<a href="#">
Esportes
</a>

</nav>



<div class="search">

<input 
id="campoBusca"
placeholder="Pesquisar canais..."
>


<button id="btnBusca">
🔍
</button>


</div>


</div>

</header>

<!-- ================= MAIN ================= -->

<main>


<!-- AGENDA AO VIVO -->

<section class="agenda-section">

    <div class="container">

        <div class="section-top">

            <h2>📅 Agenda Ao Vivo</h2>

            <div class="section-actions">

                <button id="agendaPrev" class="slider-btn">‹</button>

                <button id="agendaNext" class="slider-btn">›</button>

                <a href="#" class="ver-todos">
                    Ver todos →
                </a>

            </div>

        </div>

        <div id="agendaSlider" class="agenda-slider">

        </div>

    </div>

</section>


<!-- CANAIS EM DESTAQUE -->

<section class="canais-section">

    <div class="section-top">

        <h2>📺 Canais</h2>

        <div class="section-actions">

            <button id="canaisPrev" class="slider-btn">‹</button>

            <button id="canaisNext" class="slider-btn">›</button>

            <a href="canais.html" class="ver-todos">

                Ver todos →

            </a>

        </div>

    </div>

    <div id="canaisSlider" class="canais-slider"></div>

</section>


<!-- CATEGORIAS -->

<div id="categorias"></div>



</main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 Rei Dos Canais

        </p>

    </footer>

        <!-- MODAL PLAYER -->

    <div id="playerModal" class="modal">

        <div class="modal-content">

            <button id="fecharModal" class="fechar">
                ✕
            </button>

            <div class="player">

                <iframe
                    id="playerFrame"
                    allowfullscreen
                    frameborder="0"
                    allow="autoplay; encrypted-media; picture-in-picture">
                </iframe>

            </div>


            <div class="modal-info">

                <img id="modalLogo" src="" alt="">


                <div>

                    <h2 id="modalTitulo"></h2>

                    <span id="modalCategoria"></span>

                </div>

            </div>


            <div class="programacao">

                <h3>🔴 Agora</h3>

                <p id="programaAtual"></p>


                <h3>⏭ Próximo</h3>

                <p id="proximoPrograma"></p>

            </div>

        </div>

    </div>


    <!-- JavaScript -->

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>

<script src="js/hero.js"></script>
<script src="js/home.js"></script>
