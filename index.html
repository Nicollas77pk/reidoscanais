
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReiDosCainais | TV Online</title>

    <meta name="description"
        content="Assista canais de TV online organizados por categorias de forma rápida e prática.">

    <link rel="icon" href="assets/favicon.png">

    <!-- CSS -->

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="container">

           <a href="index.html" class="logo">

    <div class="logo-icon">

        👑

    </div>

    <div class="logo-text">

        <span>Rei</span>

        <strong>Dos Canais</strong>

    </div>

</a>

            <nav class="menu">

                <a href="#">Início</a>
                <a href="#abertos">Abertos</a>
                <a href="#esportes">Esportes</a>
                <a href="#filmes">Filmes</a>
                <a href="#infantil">Infantil</a>

            </nav>

            <div class="search">

                <input
                    type="text"
                    id="campoBusca"
                    placeholder="Pesquisar canais...">

                <button id="btnBusca">

                    🔍

                </button>

            </div>

        </div>

    </header>

    <!-- ================= HERO ================= -->

    <section class="hero">

        <div class="hero-overlay">

            <div class="hero-content">

                <span class="badge">

                    📺 TV Online

                </span>

                <h1>

                    Assista seus canais favoritos em um só lugar.

                </h1>

                <p>

                    Canais organizados por categorias com acesso rápido.

                </p>

                <button class="btnHero">

                    Explorar canais

                </button>

            </div>

        </div>

    </section>

    <!-- ================= MAIN ================= -->

    <main>

        <!-- Destaques -->

        <section class="categoria">

            <div class="titulo">

                <h2>

                    🔥 Em Destaque

                </h2>

                <a href="#">

                    Ver todos

                </a>

            </div>

            <div
                id="destaques"
                class="cards">

            </div>

        </section>

        <!-- Abertos -->

        <section
            id="abertos"
            class="categoria">

            <div class="titulo">

                <h2>

                    📺 Canais Abertos

                </h2>

            </div>

            <div
                id="listaAbertos"
                class="cards">

            </div>

        </section>

        <!-- Esportes -->

        <section
            id="esportes"
            class="categoria">

            <div class="titulo">

                <h2>

                    ⚽ Esportes

                </h2>

            </div>

            <div
                id="listaEsportes"
                class="cards">

            </div>

        </section>

        <!-- Filmes -->

        <section
            id="filmes"
            class="categoria">

            <div class="titulo">

                <h2>

                    🎬 Filmes

                </h2>

            </div>

            <div
                id="listaFilmes"
                class="cards">

            </div>

        </section>

        <!-- Infantil -->

        <section
            id="infantil"
            class="categoria">

            <div class="titulo">

                <h2>

                    🧸 Infantil

                </h2>

            </div>

            <div
                id="listaInfantil"
                class="cards">

            </div>

        </section>

    </main>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 Rei Dos Canais

        </p>

    </footer>

    <!-- JavaScript -->

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/card.js"></script>
    <script src="js/home.js"></script>
    <script src="js/busca.js"></script>

</body>

</html>
